name: Widgets Check
on:
  pull_request:
  workflow_dispatch:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://bwonxnayayopbohxuphs.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug
        working-directory: native/android
      - uses: actions/upload-artifact@v4
        with:
          name: QuiniDerio-Android-test
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec project.yml
        working-directory: native/ios
      - run: xcodebuild -project QuiniDerio.xcodeproj -scheme QuiniDerio -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: native/ios
